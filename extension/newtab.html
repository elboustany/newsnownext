<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="logo" href="https://www.newsnownext.org/" title="Open newsnownext.org">
      <span class="l1">NEWS</span><span class="l2">NOW</span><span class="l3">NEXT</span>
    </a>
    <div class="nav-links">
      <span id="status">—</span>
      <button class="refresh" id="refresh" type="button">Refresh</button>
    </div>
  </div>
</nav>

<div class="wrap">

  <div class="filters" data-filters>
    <div class="frow">
      <div class="fsearch">
        <label class="sr-only" for="f-q">Filter headlines</label>
        <input id="f-q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Filter headlines…  (press / )">
      </div>
      <label class="sr-only" for="f-sort">Order</label>
      <select id="f-sort" class="fsel">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <div class="frow">
      <span class="flabel">Region</span>
      <nav class="chips" id="f-regions" aria-label="Filter by region"></nav>
    </div>

    <details class="more">
      <summary>More filters</summary>
      <div class="frow">
        <span class="flabel">Topic</span>
        <nav class="chips" id="f-topics" aria-label="Filter by topic"></nav>
      </div>
      <div class="frow">
        <span class="flabel">Since</span>
        <label class="sr-only" for="f-window">Time window</label>
        <select id="f-window" class="fsel">
          <option value="0">Any time</option>
          <option value="6">Last 6 hours</option>
          <option value="12">Last 12 hours</option>
          <option value="24">Last 24 hours</option>
        </select>
      </div>
    </details>

    <p class="fcount">
      <span id="f-count">Loading…</span>
      <button class="linkbtn" id="f-clear" type="button" hidden>Clear filters</button>
    </p>
  </div>

  <p class="empty" id="f-empty" hidden>Nothing matches those filters.</p>

  <div class="grid" id="grid" aria-live="polite" aria-busy="true"></div>

  <footer class="foot">
    Headlines link out to their publishers. NewsNowNext does not host or
    reproduce article text.
  </footer>

</div>

<script type="module" src="newtab.js"></script>
</body>
</html>

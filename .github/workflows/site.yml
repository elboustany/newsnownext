# Builds the site from live feeds and deploys it to Cloudflare Pages.
#
# Runs every 30 minutes during market hours (Mon-Fri), every 3 hours on
# weekends, on every push to main, and on demand from the Actions tab.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - from any Cloudflare dashboard URL
#
# If a build fails (for example every feed is down), the deploy step is
# skipped and the previous deployment stays live. GitHub emails the repo
# owner about failed runs by default.

name: Build and deploy site

on:
  schedule:
    - cron: "*/30 5-21 * * 1-5"   # UTC: covers Tokyo close through NY close
    - cron: "0 6-21/3 * * 0,6"    # weekends: light touch
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Feed cache and trending history persist across runs; this is what
      # makes the "up from 2 desks" velocity signal real in production.
      - uses: actions/cache@v4
        with:
          path: generator/.cache
          key: nnn-cache-${{ github.run_id }}
          restore-keys: |
            nnn-cache-

      - name: Generated files are current
        run: |
          python3 dev/gen-feeds.py --check
          python3 dev/gen-css.py --check

      - name: Offline self-test (thin-content guard)
        working-directory: generator
        run: |
          python3 build.py --config config.test.json
          grep -q 'topics/oil.html' site-test/sitemap.xml
          grep -q 'noindex' site-test/topics/thin-check.html
          ! grep -q 'thin-check' site-test/sitemap.xml

      - name: Build from live feeds
        working-directory: generator
        run: python3 build.py

      - name: Sanity-check the output
        run: |
          test -s generator/site/index.html
          test -s generator/site/sitemap.xml
          count=$(grep -c 'data-item' generator/site/index.html)
          echo "home page items: $count"
          test "$count" -ge 50

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create newsnownext \
            --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy generator/site \
            --project-name=newsnownext --branch=main --commit-dirty=true

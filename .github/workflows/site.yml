# Builds the site from live feeds and publishes it to the `production`
# branch. Cloudflare Pages watches that branch through its Git integration
# and deploys whatever lands there, so this pipeline needs NO secrets at
# all: the only credential involved is the runner's own ephemeral token.
#
# Runs every 30 minutes during market hours (Mon-Fri), every 3 hours on
# weekends, on every push to main, and on demand from the Actions tab.
#
# If a build fails (for example every feed is down), nothing is published
# and the previous deployment stays live. GitHub emails the repo owner
# about failed runs by default.

name: Build and publish site

on:
  schedule:
    - cron: "*/30 5-21 * * 1-5"   # UTC: covers Tokyo close through NY close
    - cron: "0 6-21/3 * * 0,6"    # weekends: light touch
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Feed cache and trending history persist across runs; this is what
      # makes the "up from 2 desks" velocity signal real in production.
      - uses: actions/cache@v4
        with:
          path: generator/.cache
          key: nnn-cache-${{ github.run_id }}
          restore-keys: |
            nnn-cache-

      - name: Generated files are current
        run: |
          python3 dev/gen-feeds.py --check
          python3 dev/gen-css.py --check

      - name: Offline self-test (thin-content guard)
        working-directory: generator
        run: |
          python3 build.py --config config.test.json
          grep -q 'topics/oil.html' site-test/sitemap.xml
          grep -q 'noindex' site-test/topics/thin-check.html
          ! grep -q 'thin-check' site-test/sitemap.xml

      - name: Build from live feeds
        working-directory: generator
        run: python3 build.py

      - name: Sanity-check the output
        run: |
          test -s generator/site/index.html
          test -s generator/site/sitemap.xml
          count=$(grep -o 'data-item' generator/site/index.html | wc -l)
          echo "home page items: $count"
          test "$count" -ge 50

      # A fresh orphan commit each run keeps the branch at exactly one
      # commit, so the repo never grows from deploys.
      - name: Publish to the production branch
        run: |
          cd generator/site
          git init -q -b production
          git config user.name "newsnownext-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Site build $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            production
        env:
          GITHUB_TOKEN: ${{ github.token }}
